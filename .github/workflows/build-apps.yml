name: Build apps

# Builds the portal's apps from this repository:
#   Android  .apk  (expo-app/, Ubuntu)
#   iOS      .ipa  (expo-app/, macOS; unsigned, see below)
#   Windows  .exe  (desktop/, Windows installer)
# All three open the portal website, so a website change needs no new app. Download the files from
# the run's page: Actions -> Build apps -> the run -> Artifacts.
#
# Settings (GitHub -> Settings -> Secrets and variables -> Actions):
#   Secret    EXPO_TOKEN   required; a token of the Expo account that owns the project (expo-app/app.json).
#                          The Android signing key lives on Expo, set up once with `eas credentials`.
#   Variable  WEB_URL      optional; the site the apps open (default below)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "expo-app/**"
      - "desktop/**"
      - ".github/workflows/build-apps.yml"

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WEB_URL: ${{ vars.WEB_URL || 'https://portals.nfskills.com' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: expo-app
    env:
      EXPO_PUBLIC_WEB_URL: ${{ vars.WEB_URL || 'https://portals.nfskills.com' }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      # Runs on this machine (no EAS build minutes); EAS supplies the signing key and the next version code.
      - name: Build signed APK with EAS
        run: npx --yes eas-cli@latest build --local --platform android --profile preview --non-interactive --output "nfskills-portal-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: android-apk-${{ github.run_number }}
          path: expo-app/nfskills-portal-*.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    # Unsigned: installs only after re-signing (Sideloadly or AltStore with an Apple ID). A directly
    # installable or App Store build needs an Apple Developer account and signing through EAS.
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: expo-app
    env:
      EXPO_PUBLIC_WEB_URL: ${{ vars.WEB_URL || 'https://portals.nfskills.com' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-app/package-lock.json
      - run: npm ci
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Build unsigned IPA
        working-directory: expo-app/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          xcodebuild archive \
            -workspace "$WORKSPACE" -scheme "${WORKSPACE%.xcworkspace}" \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/expo-app/nfskills-portal-unsigned-${{ github.run_number }}.ipa" Payload)
      - uses: actions/upload-artifact@v5
        with:
          name: ios-ipa-unsigned-${{ github.run_number }}
          path: expo-app/nfskills-portal-unsigned-*.ipa
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Set the portal address and version
        run: npm pkg set "portalUrl=$WEB_URL" "version=1.0.${{ github.run_number }}"
      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: windows-exe-${{ github.run_number }}
          path: desktop/dist/nfskills-portal-setup-*.exe
          if-no-files-found: error
          retention-days: 30
